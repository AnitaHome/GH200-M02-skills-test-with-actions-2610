name: Python Coverage

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  contents: write

jobs:
  python-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
            path: ~/.cache/pip
            key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
            restore-keys: ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pip install coverage==7.9
          pip install pytest-cov==6.2.1

      - name: Run tests and generate coverage details
        run: pytest --cov=src --cov-report=html

      - name: Upload coverage HTML report artifact
        uses: actions/upload-artifact@v4
        with:
            name: coverage-html-report
            path: htmlcov/
            retention-days: 90        

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 70

      - name: Fail if below threshold
        run: coverage report --fail-under=90

 # 貼在 jobs: 底下（注意前面有 2 個空格縮排，與 python-coverage: 平級）
  archive-report:
    name: Archive & Verify Artifact
    runs-on: ubuntu-latest
    needs: [python-coverage]
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-html-report
          path: downloaded-htmlcov/

      - name: List downloaded files
        run: |
          echo "跨 Job 成功下載產物！檔案清單："
          ls -la downloaded-htmlcov/